name: Encrypt check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Encrypt page
        run: npm run build

      - name: Assert dist layout (strict CSP)
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/gate.js
          test -f dist/gate.css
          test -f dist/gate-config.json
          if grep -q "Hello, circle" dist/index.html; then
            echo "ERROR: plaintext marker found inside dist/index.html"
            exit 1
          fi
          if grep -q "<script>" dist/index.html; then
            echo "ERROR: inline script in index.html (breaks strict CSP)"
            exit 1
          fi
          grep -q "gate.js" dist/index.html
          grep -q "Kirjaudu" dist/index.html
          node -e "const c=require('./dist/gate-config.json'); if(c.pageId!=='hello-circle') process.exit(1)"
          echo "OK: CSP-safe loader + gate-config.json"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-encrypted
          path: dist/
