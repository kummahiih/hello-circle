name: Encrypt check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Show package versions
        run: npm ls --depth=0

      - name: Encrypt page
        run: npm run build

      - name: Assert dist layout (strict CSP + hashes hygiene)
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/gate.js
          test -f dist/gate.css
          test -f dist/gate-config.json
          test -f dist/enroll.html
          if [ -d dist/hashes ]; then
            echo "ERROR: hashes/ must not appear under dist/"
            exit 1
          fi
          if ls dist/*.json 2>/dev/null | grep -v gate-config.json; then
            echo "ERROR: unexpected JSON in dist (enroll hashes?)"
            exit 1
          fi
          if grep -q "Hello, circle" dist/index.html; then
            echo "ERROR: plaintext marker found inside dist/index.html"
            exit 1
          fi
          if grep -q "<script>" dist/index.html; then
            echo "ERROR: inline script in index.html (breaks strict CSP)"
            exit 1
          fi
          grep -q "gate.js" dist/index.html
          grep -q "Kirjaudu" dist/index.html
          grep -q "blob:" dist/index.html
          node -e "const c=require('./dist/gate-config.json'); if(c.pageId!=='hello-circle') process.exit(1); if(!(c.entries||[]).some(e=>e.alg==='WebAuthn-PRF')) { console.error('missing WebAuthn-PRF entry'); process.exit(1); }"
          grep -q "go-prf" dist/index.html
          echo "OK: CSP-safe loader + no hashes in dist + passkey entry"

      - name: Demo passwords unlock ciphertext
        run: npm run test:unlock

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-encrypted
          path: dist/
